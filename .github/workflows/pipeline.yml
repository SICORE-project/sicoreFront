name: CI/CD Pipeline + Attribution Tech Lead

on:
  # Déclenchement pour l'attribution automatique du Tech Lead
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - deploy
      - module-administration
      - module-parametrage
      - module-indemnite
      - module-paie

  # Déclenchement CI/CD
  push:
    branches:
      - deploy

permissions:
  contents: read
  pull-requests: write

jobs:

  # ==========================================
  # 1. ATTRIBUTION AUTOMATIQUE DU TECH LEAD
  # ==========================================
  assign-tech-lead:
    name: Attribution automatique du Tech Lead
    runs-on: ubuntu-latest

    # Ce job ne doit s'exécuter que pour les événements PR
    if: github.event_name == 'pull_request'

    steps:
      - name: Déterminer le Tech Lead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

        run: |
          echo "=========================================="
          echo "Attribution automatique du Tech Lead"
          echo "=========================================="

          echo "Auteur : $PR_AUTHOR"
          echo "Branche cible : $BASE_BRANCH"
          echo "Pull Request : #$PR_NUMBER"

          if [ "$BASE_BRANCH" = "module-administration" ]; then
            TECH_LEAD="mmesall"

          elif [ "$BASE_BRANCH" = "module-parametrage" ]; then
            TECH_LEAD="mmesall"

          elif [ "$BASE_BRANCH" = "module-indemnite" ]; then
            TECH_LEAD="Fatoush-prog"

          elif [ "$BASE_BRANCH" = "module-paie" ]; then
            TECH_LEAD="BayeSaliou1995"

          else
            echo "Aucun Tech Lead configuré pour $BASE_BRANCH"
            exit 0
          fi

          echo "Tech Lead : $TECH_LEAD"

          echo "Attribution du reviewer..."

          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-reviewer "$TECH_LEAD"

          echo "Tech Lead $TECH_LEAD ajouté comme reviewer."


  # ==========================================
  # 2. CONTINUOUS INTEGRATION
  # ==========================================
  test:
    name: Tests Laravel
    runs-on: ubuntu-latest

    # Le job test fonctionne :
    # - sur les PR vers deploy
    # - sur les push vers deploy
    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'deploy'
      )

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath, gd
          coverage: none

      - name: Vérifier la version PHP
        run: php -v

      - name: Vérifier Composer
        run: composer --version

      - name: Copier .env.testing
        run: |
          if [ -f .env.testing ]; then
            echo ".env.testing existe déjà."
          else
            cp .env.example .env.testing
            echo ".env.testing créé depuis .env.example."
          fi

      - name: Installer les dépendances Composer
        run: |
          composer install \
            --no-ansi \
            --no-interaction \
            --no-scripts \
            --no-progress \
            --prefer-dist

      - name: Générer la clé Laravel
        run: php artisan key:generate --env=testing

      # Décommenter lorsque les tests sont prêts
      # - name: Exécuter les migrations
      #   run: php artisan migrate --env=testing --force
      #   env:
      #     DB_CONNECTION: mysql
      #     DB_HOST: 127.0.0.1
      #     DB_PORT: 3306
      #     DB_DATABASE: testing
      #     DB_USERNAME: root
      #     DB_PASSWORD: ""

      # - name: Exécuter les tests
      #   run: php artisan test
      #   env:
      #     DB_CONNECTION: mysql
      #     DB_HOST: 127.0.0.1
      #     DB_PORT: 3306
      #     DB_DATABASE: testing
      #     DB_USERNAME: root
      #     DB_PASSWORD: ""


  # ==========================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================
  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest

    # Déploiement uniquement après un push sur deploy
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/deploy'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true

          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sicorefront:latest
            ${{ secrets.DOCKER_USERNAME }}/sicorefront:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}

          script: |
            cd /var/www/sicorefront

            echo "Pull de la nouvelle image Docker..."
            docker compose -f docker-compose-frontend.yml pull

            echo "Redémarrage des conteneurs..."
            docker compose -f docker-compose-frontend.yml up -d

            echo "Nettoyage des anciennes images..."
            docker image prune -f

            echo "Déploiement terminé."