name: CI/CD Frontend

on:
  push:
    branches:
      - deploy

  pull_request:
    branches:
      - deploy

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================================
  ci:
    name: Tests et Vérification Frontend
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Récupération du code
      # ------------------------------------------------------

      - name: Recuperer le code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # PHP
      # ------------------------------------------------------

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql, intl, zip
          coverage: none

      - name: Verifier PHP
        run: |
          php -v


      # ------------------------------------------------------
      # Composer
      # ------------------------------------------------------

      - name: Verifier Composer
        run: |
          composer --version


      - name: Verifier composer.json
        run: |
          composer validate --no-check-publish


      - name: Installer les dependances PHP
        run: |
          if [ -f composer.lock ]; then
            composer install \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --no-dev \
              --optimize-autoloader
          else
            composer update \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --no-dev \
              --optimize-autoloader
          fi


      # ------------------------------------------------------
      # Préparation Laravel
      # ------------------------------------------------------

      - name: Verifier .env.example
        run: |
          test -f .env.example
          echo ".env.example trouvé."


      - name: Preparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --ansi


      # ------------------------------------------------------
      # Vérification Laravel
      # ------------------------------------------------------

      - name: Verifier Laravel
        run: |
          php artisan --version
          php artisan about


      # ------------------------------------------------------
      # Vérification des assets frontend
      # ------------------------------------------------------

      - name: Verifier les assets frontend
        run: |
          test -d public/assets

          echo "======================================"
          echo "Dossier public/assets trouvé"
          echo "======================================"

          find public/assets -type f | head -30


      # ------------------------------------------------------
      # Vérification Dockerfile
      # ------------------------------------------------------

      - name: Verifier Dockerfile
        run: |
          test -f ./Dockerfile
          echo "Dockerfile trouvé."


      # ------------------------------------------------------
      # Vérification des fichiers Docker
      # ------------------------------------------------------

      - name: Verifier les fichiers Docker
        run: |
          test -f ./docker/nginx.conf
          test -f ./docker/supervisord.conf

          echo "Configuration Docker valide."


  # ==========================================================
  # 2. BUILD + PUSH IMAGE DOCKER
  # ==========================================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: ci

    # Docker uniquement après un push vers deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'

    steps:

      # ------------------------------------------------------
      # Récupération du code
      # ------------------------------------------------------

      - name: Recuperer le code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Vérification Dockerfile
      # ------------------------------------------------------

      - name: Verifier Dockerfile
        run: |
          echo "======================================"
          echo "Contenu du repository"
          echo "======================================"

          ls -la

          echo "======================================"
          echo "Verification du Dockerfile"
          echo "======================================"

          test -f ./Dockerfile

          echo "Dockerfile trouvé."


      # ------------------------------------------------------
      # Vérification configuration Docker
      # ------------------------------------------------------

      - name: Verifier configuration Docker
        run: |
          test -f ./docker/nginx.conf
          test -f ./docker/supervisord.conf

          echo "Fichiers Docker trouvés."


      # ------------------------------------------------------
      # Connexion à GHCR
      # ------------------------------------------------------

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------
      # Build + Push
      # ------------------------------------------------------

      - name: Construire et pousser l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/sicore-project/sicore-frontend:latest
            ghcr.io/sicore-project/sicore-frontend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # 3. DEPLOY VPS
  # ==========================================================
  deploy:
    name: Deploy Frontend VPS
    runs-on: ubuntu-latest

    needs:
      - ci
      - docker

    # Déploiement uniquement après un push vers deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'

    steps:

      # ------------------------------------------------------
      # Déploiement SSH
      # ------------------------------------------------------

      - name: Deployer sur le VPS
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}

          timeout: 30s
          command_timeout: 10m
          script_stop: true

          script: |

            echo "======================================"
            echo "Déploiement SICORE Frontend"
            echo "======================================"


            # ------------------------------------------------
            # Dossier du projet
            # ------------------------------------------------

            echo "Accès au dossier frontend..."

            cd "${{ secrets.FRONTEND_DEPLOY_PATH }}"

            echo "Répertoire courant :"
            pwd

            echo "Contenu du répertoire :"
            ls -la


            # ------------------------------------------------
            # Vérification Docker
            # ------------------------------------------------

            echo "======================================"
            echo "Vérification Docker"
            echo "======================================"

            docker --version
            docker compose version


            # ------------------------------------------------
            # Vérification docker-compose
            # ------------------------------------------------

            echo "======================================"
            echo "Vérification docker-compose"
            echo "======================================"

            test -f docker-compose-frontend.yml

            echo "docker-compose-frontend.yml trouvé."


            # ------------------------------------------------
            # Connexion à GHCR
            # ------------------------------------------------

            echo "======================================"
            echo "Connexion à GHCR"
            echo "======================================"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin


            # ------------------------------------------------
            # Télécharger la nouvelle image
            # ------------------------------------------------

            echo "======================================"
            echo "Téléchargement de la nouvelle image"
            echo "======================================"

            docker compose \
              -f docker-compose-frontend.yml \
              pull


            # ------------------------------------------------
            # Redémarrer les conteneurs
            # ------------------------------------------------

            echo "======================================"
            echo "Démarrage des conteneurs"
            echo "======================================"

            docker compose \
              -f docker-compose-frontend.yml \
              up -d


            # ------------------------------------------------
            # Vérifier les conteneurs
            # ------------------------------------------------

            echo "======================================"
            echo "État des conteneurs"
            echo "======================================"

            docker compose \
              -f docker-compose-frontend.yml \
              ps


            # ------------------------------------------------
            # Vérifier les logs
            # ------------------------------------------------

            echo "======================================"
            echo "Logs du frontend"
            echo "======================================"

            docker compose \
              -f docker-compose-frontend.yml \
              logs --tail=50 frontend


            # ------------------------------------------------
            # Nettoyage
            # ------------------------------------------------

            echo "======================================"
            echo "Nettoyage des anciennes images"
            echo "======================================"

            docker image prune -f


            # ------------------------------------------------
            # Fin
            # ------------------------------------------------

            echo "======================================"
            echo "Déploiement frontend terminé avec succès"
            echo "======================================"